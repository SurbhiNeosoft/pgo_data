name: Flutter PGO Build

on:
  push:
    branches:
      - workflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate ART Profile
        run: |
          flutter build apk --profile --target-platform android-arm64
          adb install build/app/outputs/flutter-apk/app-profile.apk
          adb shell am start -n com.example.pgo_demo/.MainActivity
          # Simulate user actions here (or automate with tools like Espresso).
          adb shell kill <app_package_name>
          adb pull /data/misc/profiles/cur/0/<app_package_name>/primary.prof baseline-prof.txt

      - name: Include ART Profile
        run: |
          mkdir -p android/app/src/main/baseline-prof
          mv baseline-prof.txt android/app/src/main/baseline-prof

      - name: Build Release APK with PGO
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk